<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#689F38"/>
      <stop offset="100%" stop-color="#8BC34A"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AED581"/>
      <stop offset="100%" stop-color="#DCEDC8"/>
    </linearGradient>
    <clipPath id="square">
      <rect x="40" y="40" width="432" height="432" rx="32"/>
    </clipPath>
  </defs>

  <!-- Background square -->
  <rect x="40" y="40" width="432" height="432" rx="32" fill="#1B1B1D"/>

  <!-- Abstract pear — three overlapping translucent shapes -->
  <g clip-path="url(#square)">
    <!-- Bottom bulb: wide ellipse -->
    <ellipse cx="256" cy="380" rx="130" ry="110" fill="url(#g1)" opacity="0.85"/>

    <!-- Top neck: tall ellipse -->
    <ellipse cx="256" cy="230" rx="75" ry="90" fill="url(#g1)" opacity="0.8"/>

    <!-- Highlight overlay -->
    <ellipse cx="220" cy="300" rx="55" ry="100" fill="url(#g2)" opacity="0.18" transform="rotate(-8 220 300)"/>

    <!-- Stem: simple angled line -->
    <line x1="256" y1="155" x2="262" y2="90" stroke="#6D8C50" stroke-width="5" stroke-linecap="round"/>

    <!-- Leaf: simple angled ellipse -->
    <ellipse cx="282" cy="105" rx="28" ry="12" fill="#7CB342" opacity="0.75" transform="rotate(-30 282 105)"/>
    <ellipse cx="282" cy="105" rx="28" ry="12" fill="none" stroke="#689F38" stroke-width="1" transform="rotate(-30 282 105)" opacity="0.4"/>

    <!-- Subtle horizon line across the pear -->
    <line x1="140" y1="280" x2="372" y2="280" stroke="#DCEDC8" stroke-width="0.8" opacity="0.1"/>
    <line x1="160" y1="340" x2="352" y2="340" stroke="#DCEDC8" stroke-width="0.5" opacity="0.08"/>
  </g>

  <!-- Name -->
  <text x="256" y="490" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="300" letter-spacing="12" fill="#757575">pearblossom</text>
</svg>
