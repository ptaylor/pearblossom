<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tapered trunk — thick, narrowing upward -->
  <polygon points="240,440 272,440 266,280 246,280" fill="#5A8A9A"/>
  <!-- Y-split branches -->
  <polygon points="246,280 266,280 216,185 202,188" fill="#5A8A9A"/>
  <polygon points="246,280 266,280 340,180 326,183" fill="#5A8A9A"/>

  <!-- Larger canopy — photo rectangles as leaves, scaled up -->
  <!-- Left branch -->
  <rect x="115" y="140" width="62" height="44" rx="5" fill="#C8E6C9" transform="rotate(-18, 146, 162)"/>
  <rect x="105" y="180" width="56" height="40" rx="5" fill="#DCEDC8" transform="rotate(10, 133, 200)"/>
  <rect x="145" y="105" width="52" height="38" rx="5" fill="#A5D6A7" transform="rotate(-8, 171, 124)"/>
  <rect x="90" y="210" width="48" height="34" rx="5" fill="#C5E1A5" transform="rotate(24, 114, 227)"/>
  <rect x="165" y="185" width="44" height="30" rx="5" fill="#F0F4C3" transform="rotate(-14, 187, 200)"/>

  <!-- Right branch -->
  <rect x="340" y="135" width="62" height="44" rx="5" fill="#DCEDC8" transform="rotate(20, 371, 157)"/>
  <rect x="358" y="175" width="56" height="40" rx="5" fill="#C8E6C9" transform="rotate(-10, 386, 195)"/>
  <rect x="318" y="105" width="52" height="38" rx="5" fill="#A5D6A7" transform="rotate(10, 344, 124)"/>
  <rect x="375" y="210" width="48" height="34" rx="5" fill="#F0F4C3" transform="rotate(-24, 399, 227)"/>
  <rect x="305" y="182" width="44" height="30" rx="5" fill="#C5E1A5" transform="rotate(15, 327, 197)"/>

  <!-- Top / center -->
  <rect x="202" y="75" width="66" height="48" rx="5" fill="#A5D6A7" transform="rotate(-4, 235, 99)"/>
  <rect x="225" y="115" width="52" height="38" rx="5" fill="#F0F4C3" transform="rotate(12, 251, 134)"/>
  <rect x="185" y="118" width="46" height="32" rx="5" fill="#C8E6C9" transform="rotate(-16, 208, 134)"/>
  <rect x="250" y="145" width="42" height="30" rx="5" fill="#DCEDC8" transform="rotate(-6, 271, 160)"/>

  <!-- App name -->
  <text x="256" y="490" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="300" letter-spacing="12" fill="#E8B896">pearblossom</text>
</svg>
