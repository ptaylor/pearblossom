<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pear" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#C5E1A5"/>
      <stop offset="100%" stop-color="#8BC34A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="blossom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="#FAFAFA"/>

  <!-- Pear -->
  <path d="M256 95 Q277 95 288 115 Q308 150 314 200 Q322 265 317 325 Q312 375 292 410 Q274 438 256 442 Q238 438 220 410 Q200 375 195 325 Q190 265 198 200 Q204 150 224 115 Q235 95 256 95 Z"
        fill="url(#pear)" opacity="0.92"/>

  <!-- Highlight -->
  <ellipse cx="228" cy="265" rx="28" ry="55" fill="white" opacity="0.18" transform="rotate(-6 228 265)"/>

  <!-- Stem -->
  <path d="M256 95 Q258 75 262 58 Q265 48 259 42" stroke="#8D6E63" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Leaf -->
  <path d="M260 58 Q285 32 308 30 Q300 42 286 55 Q270 62 260 60 Z" fill="url(#leaf)" opacity="0.85"/>

  <!-- Blossom -->
  <g transform="translate(218, 140)">
    <ellipse cx="0" cy="-14" rx="8" ry="13" fill="url(#blossom)"/>
    <ellipse cx="0" cy="-14" rx="8" ry="13" fill="url(#blossom)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-14" rx="8" ry="13" fill="url(#blossom)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-14" rx="8" ry="13" fill="url(#blossom)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-14" rx="8" ry="13" fill="url(#blossom)" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="6" fill="#FFB300"/>
  </g>

  <!-- Small bud -->
  <g transform="translate(278, 125)">
    <ellipse cx="0" cy="-8" rx="5" ry="9" fill="url(#blossom)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-8" rx="5" ry="9" fill="url(#blossom)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-8" rx="5" ry="9" fill="url(#blossom)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-8" rx="5" ry="9" fill="url(#blossom)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-8" rx="5" ry="9" fill="url(#blossom)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-8" rx="5" ry="9" fill="url(#blossom)" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="4" fill="#FFB300"/>
  </g>

  <text x="256" y="482" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="300" letter-spacing="10" fill="#BDBDBD">pearblossom</text>
</svg>
