<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <filter id="photoShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="photoShadowLight">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Photo 1: Landscape sky (top left, tilted left) -->
  <g transform="translate(100, 100) rotate(-7)" filter="url(#photoShadow)">
    <rect x="-95" y="-72" width="190" height="144" rx="5" fill="#FAFAFA" stroke="#555" stroke-width="1"/>
    <rect x="-88" y="-65" width="176" height="108" rx="3" fill="#B3E5FC"/>
    <ellipse cx="-20" cy="-25" rx="30" ry="13" fill="white" opacity="0.9"/>
    <ellipse cx="10" cy="-32" rx="22" ry="11" fill="white" opacity="0.85"/>
    <ellipse cx="40" cy="-20" rx="25" ry="9" fill="white" opacity="0.7"/>
    <circle cx="50" cy="-45" r="13" fill="#FFD54F" opacity="0.85"/>
  </g>

  <!-- Photo 2: Green hills (bottom left, tilted right) -->
  <g transform="translate(88, 380) rotate(5)" filter="url(#photoShadow)">
    <rect x="-85" y="-65" width="170" height="130" rx="5" fill="#FAFAFA" stroke="#555" stroke-width="1"/>
    <rect x="-78" y="-58" width="156" height="94" rx="3" fill="#E8F5E9"/>
    <ellipse cx="-15" cy="22" rx="55" ry="28" fill="#A5D6A7"/>
    <ellipse cx="40" cy="25" rx="48" ry="25" fill="#81C784"/>
    <rect x="-40" y="-2" width="3" height="14" fill="#5D4037"/>
    <circle cx="-38" cy="-8" r="10" fill="#4CAF50"/>
    <rect x="20" y="2" width="2.5" height="12" fill="#5D4037"/>
    <circle cx="21" cy="-4" r="9" fill="#388E3C"/>
  </g>

  <!-- Photo 3: Blossom closeup (center, large, barely tilted) -->
  <g transform="translate(260, 260) rotate(-2)" filter="url(#photoShadow)">
    <rect x="-100" y="-78" width="200" height="156" rx="5" fill="#FAFAFA" stroke="#555" stroke-width="1"/>
    <rect x="-93" y="-71" width="186" height="120" rx="3" fill="#FCE4EC"/>
    <!-- Blossom -->
    <g transform="translate(10, -10)">
      <ellipse cx="0" cy="-28" rx="15" ry="24" fill="#FFF9C4" opacity="0.9"/>
      <ellipse cx="0" cy="-28" rx="15" ry="24" fill="#FFF9C4" opacity="0.9" transform="rotate(72)"/>
      <ellipse cx="0" cy="-28" rx="15" ry="24" fill="#FFF9C4" opacity="0.9" transform="rotate(144)"/>
      <ellipse cx="0" cy="-28" rx="15" ry="24" fill="#FFF9C4" opacity="0.9" transform="rotate(216)"/>
      <ellipse cx="0" cy="-28" rx="15" ry="24" fill="#FFF9C4" opacity="0.9" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="11" fill="#FF8F00"/>
      <circle cx="-3" cy="-3" r="3" fill="#FFB300"/>
      <circle cx="3" cy="3" r="2.5" fill="#FFB300"/>
    </g>
    <!-- Stem & leaf -->
    <path d="M10 12 Q15 30 22 50" stroke="#66BB6A" stroke-width="3" fill="none"/>
    <ellipse cx="28" cy="22" rx="13" ry="5.5" fill="#81C784" transform="rotate(-15 28 22)"/>
  </g>

  <!-- Photo 4: Blue water (right edge, tilted left) -->
  <g transform="translate(390, 160) rotate(-5)" filter="url(#photoShadowLight)">
    <rect x="-75" y="-55" width="150" height="110" rx="5" fill="#FAFAFA" stroke="#555" stroke-width="1"/>
    <rect x="-68" y="-48" width="136" height="74" rx="3" fill="#E3F2FD"/>
    <path d="M-65 -12 Q-35 -22 -5 -12 Q25 -2 55 -12 Q68 -18 68 -12" stroke="#64B5F6" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M-60 5 Q-30 -5 0 5 Q30 15 60 5 Q67 2 67 5" stroke="#90CAF9" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>

  <!-- Photo 5: Warm sunset (top right, tilted right) -->
  <g transform="translate(400, 370) rotate(8)" filter="url(#photoShadowLight)">
    <rect x="-65" y="-48" width="130" height="96" rx="5" fill="#FAFAFA" stroke="#555" stroke-width="1"/>
    <rect x="-58" y="-41" width="116" height="60" rx="3" fill="#FFF3E0"/>
    <rect x="-58" y="-41" width="116" height="28" rx="3" fill="#FFCC80"/>
    <rect x="-58" y="-20" width="116" height="14" rx="0" fill="#FFAB91"/>
    <circle cx="25" cy="-22" r="10" fill="#FF8A65" opacity="0.85"/>
    <line x1="-58" y1="-13" x2="58" y2="-13" stroke="#BCAAA4" stroke-width="0.7" opacity="0.4"/>
  </g>

  <!-- Pear outline traced by overlapping photo corners -->
  <path d="M256 75 Q275 75 288 95 Q310 130 320 180 Q333 250 328 320 Q323 375 298 410 Q275 438 256 442 Q237 438 214 410 Q189 375 184 320 Q179 250 192 180 Q202 130 224 95 Q237 75 256 75 Z"
        fill="none" stroke="#9CCC65" stroke-width="2.5" opacity="0.4" stroke-dasharray="8 4"/>

  <!-- Subtle pear fill via intersecting photos -->
  <path d="M256 90 Q272 90 282 105 Q300 135 308 180 Q318 245 315 305 Q312 355 292 385 Q275 408 256 412 Q237 408 220 385 Q200 355 197 305 Q194 245 204 180 Q212 135 230 105 Q240 90 256 90 Z"
        fill="#9CCC65" opacity="0.06"/>

  <!-- App name -->
  <text x="256" y="485" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="300" letter-spacing="7" fill="#9CCC65" opacity="0.85">pearblossom</text>
</svg>
