<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pastel azure blue background -->
  <rect x="0" y="0" width="512" height="512" fill="#A8D8EA"/>

  <!-- Tree group — scaled ~2x about (256, 300) for dramatic full-bleed effect -->
  <g transform="translate(256,300) scale(1.8) translate(-256,-300)">
    <!-- Tapered trunk — pastel orange -->
    <polygon points="240,440 272,440 266,280 246,280" fill="#FFCC80"/>
    <!-- Y-split branches — pastel orange -->
    <polygon points="246,280 266,280 216,185 202,188" fill="#FFCC80"/>
    <polygon points="246,280 266,280 340,180 326,183" fill="#FFCC80"/>

    <!-- Canopy — photo rectangles as leaves, pastel greens / yellows / pinks -->
    <!-- Left branch -->
    <rect x="115" y="140" width="62" height="44" rx="5" fill="#B9F6CA" transform="rotate(-18, 146, 162)"/>
    <rect x="105" y="180" width="56" height="40" rx="5" fill="#FFF5BA" transform="rotate(10, 133, 200)"/>
    <rect x="145" y="105" width="52" height="38" rx="5" fill="#F8BBD0" transform="rotate(-8, 171, 124)"/>
    <rect x="90" y="210" width="48" height="34" rx="5" fill="#A5D6A7" transform="rotate(24, 114, 227)"/>
    <rect x="165" y="185" width="44" height="30" rx="5" fill="#FFE59A" transform="rotate(-14, 187, 200)"/>

    <!-- Right branch -->
    <rect x="340" y="135" width="62" height="44" rx="5" fill="#FFF5BA" transform="rotate(20, 371, 157)"/>
    <rect x="358" y="175" width="56" height="40" rx="5" fill="#FFD1DC" transform="rotate(-10, 386, 195)"/>
    <rect x="318" y="105" width="52" height="38" rx="5" fill="#B5E8C3" transform="rotate(10, 344, 124)"/>
    <rect x="375" y="210" width="48" height="34" rx="5" fill="#FFE59A" transform="rotate(-24, 399, 227)"/>
    <rect x="305" y="182" width="44" height="30" rx="5" fill="#A5D6A7" transform="rotate(15, 327, 197)"/>

    <!-- Top / center -->
    <rect x="202" y="75" width="66" height="48" rx="5" fill="#C8E6C9" transform="rotate(-4, 235, 99)"/>
    <rect x="225" y="115" width="52" height="38" rx="5" fill="#F8BBD0" transform="rotate(12, 251, 134)"/>
    <rect x="185" y="118" width="46" height="32" rx="5" fill="#B9F6CA" transform="rotate(-16, 208, 134)"/>
    <rect x="250" y="145" width="42" height="30" rx="5" fill="#FFF5BA" transform="rotate(-6, 271, 160)"/>
  </g>

  <!-- App name -->
  <text x="256" y="488" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="300" letter-spacing="12" fill="#5C7A8A">pearblossom</text>
</svg>
