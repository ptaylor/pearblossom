<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pastel azure blue background -->
  <rect x="0" y="0" width="512" height="512" fill="#A8D8EA"/>

  <!-- Tapered trunk — pastel orange, shifted up to start above text -->
  <polygon points="240,390 272,390 266,230 246,230" fill="#FFCC80"/>

  <!-- Y-split branches — pastel orange -->
  <polygon points="246,230 266,230 216,135 202,138" fill="#FFCC80"/>
  <polygon points="246,230 266,230 340,130 326,133" fill="#FFCC80"/>

  <!-- Canopy — larger photo-rect leaves clustered around the branches -->
  <!-- Pastel greens: #B9F6CA #A5D6A7 #C8E6C9 #B5E8C3 -->
  <!-- Pastel yellows: #FFF5BA #FFE59A -->
  <!-- Pastel pinks: #F8BBD0 #FFD1DC -->

  <!-- Left branch leaves (branch ~256,230 to ~209,136) -->
  <rect x="108" y="155" width="72" height="52" rx="6" fill="#B9F6CA" transform="rotate(-18, 144, 181)"/>
  <rect x="92" y="200" width="64" height="46" rx="6" fill="#FFF5BA" transform="rotate(10, 124, 223)"/>
  <rect x="128" y="128" width="60" height="44" rx="6" fill="#F8BBD0" transform="rotate(-8, 158, 150)"/>
  <rect x="70" y="225" width="60" height="44" rx="6" fill="#A5D6A7" transform="rotate(24, 100, 247)"/>
  <rect x="146" y="198" width="54" height="38" rx="6" fill="#FFE59A" transform="rotate(-14, 173, 217)"/>
  <rect x="115" y="175" width="50" height="36" rx="6" fill="#C8E6C9" transform="rotate(6, 140, 193)"/>

  <!-- Right branch leaves (branch ~256,230 to ~333,131) -->
  <rect x="338" y="150" width="72" height="52" rx="6" fill="#FFF5BA" transform="rotate(20, 374, 176)"/>
  <rect x="352" y="190" width="64" height="46" rx="6" fill="#FFD1DC" transform="rotate(-10, 384, 213)"/>
  <rect x="318" y="123" width="60" height="44" rx="6" fill="#B5E8C3" transform="rotate(10, 348, 145)"/>
  <rect x="363" y="220" width="60" height="44" rx="6" fill="#FFE59A" transform="rotate(-24, 393, 242)"/>
  <rect x="298" y="192" width="54" height="38" rx="6" fill="#A5D6A7" transform="rotate(15, 325, 211)"/>
  <rect x="340" y="170" width="50" height="36" rx="6" fill="#F8BBD0" transform="rotate(-6, 365, 188)"/>

  <!-- Center / top leaves (above the Y-split at ~256,230) -->
  <rect x="203" y="118" width="74" height="54" rx="6" fill="#C8E6C9" transform="rotate(-4, 240, 145)"/>
  <rect x="223" y="150" width="60" height="44" rx="6" fill="#F8BBD0" transform="rotate(12, 253, 172)"/>
  <rect x="183" y="155" width="54" height="40" rx="6" fill="#B9F6CA" transform="rotate(-16, 210, 175)"/>
