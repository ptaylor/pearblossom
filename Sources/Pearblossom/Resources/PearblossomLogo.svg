<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pastel azure blue background -->
  <rect x="0" y="0" width="512" height="512" fill="#A8D8EA"/>

  <!-- Tapered trunk — pastel orange, shifted up to start above text -->
  <polygon points="240,390 272,390 266,230 246,230" fill="#FFCC80"/>

  <!-- Y-split branches — pastel orange -->
  <polygon points="246,230 266,230 216,135 202,138" fill="#FFCC80"/>
  <polygon points="246,230 266,230 340,130 326,133" fill="#FFCC80"/>

  <!-- Canopy — pastel-green photo-rect leaves forming a natural tree silhouette -->
  <!-- LHS leaves lean left, RHS lean right, center nearly straight -->

  <!-- Left branch leaves — rotated counter-clockwise to fan outward -->
  <rect x="108" y="155" width="72" height="52" rx="6" fill="#A5D6A7" transform="rotate(-32, 144, 181)"/>
  <rect x="92" y="200" width="64" height="46" rx="6" fill="#C5E1A5" transform="rotate(-28, 124, 223)"/>
  <rect x="128" y="128" width="60" height="44" rx="6" fill="#B5E8C3" transform="rotate(-26, 158, 150)"/>
  <rect x="70" y="225" width="60" height="44" rx="6" fill="#DCEDC8" transform="rotate(-36, 100, 247)"/>
  <rect x="146" y="198" width="54" height="38" rx="6" fill="#C8E6C9" transform="rotate(-30, 173, 217)"/>
  <rect x="115" y="175" width="50" height="36" rx="6" fill="#B9F6CA" transform="rotate(-24, 140, 193)"/>

  <!-- Right branch leaves — rotated clockwise to fan outward -->
  <rect x="338" y="150" width="72" height="52" rx="6" fill="#C5E1A5" transform="rotate(32, 374, 176)"/>
  <rect x="352" y="190" width="64" height="46" rx="6" fill="#B5E8C3" transform="rotate(28, 384, 213)"/>
  <rect x="318" y="123" width="60" height="44" rx="6" fill="#A5D6A7" transform="rotate(26, 348, 145)"/>
  <rect x="363" y="220" width="60" height="44" rx="6" fill="#C8E6C9" transform="rotate(36, 393, 242)"/>
  <rect x="298" y="192" width="54" height="38" rx="6" fill="#DCEDC8" transform="rotate(30, 325, 211)"/>
  <rect x="340" y="170" width="50" height="36" rx="6" fill="#B9F6CA" transform="rotate(24, 365, 188)"/>

  <!-- Center / top leaves — nearly vertical, mild angles -->
  <rect x="203" y="118" width="74" height="54" rx="6" fill="#DCEDC8" transform="rotate(-4, 240, 145)"/>
  <rect x="223" y="150" width="60" height="44" rx="6" fill="#C8E6C9" transform="rotate(5, 253, 172)"/>
  <rect x="183" y="155" width="54" height="40" rx="6" fill="#B9F6CA" transform="rotate(-8, 210, 175)"/>
  <rect x="248" y="168" width="50" height="36" rx="6" fill="#A5D6A7" transform="rotate(3, 273, 186)"/>
  <rect x="210" y="140" width="48" height="34" rx="6" fill="#B5E8C3" transform="rotate(-5, 234, 157)"/>

  <!-- App name — pastel orange -->
  <text x="256" y="490" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="300" letter-spacing="12" fill="#E8945A">pearblossom</text>
</svg>
