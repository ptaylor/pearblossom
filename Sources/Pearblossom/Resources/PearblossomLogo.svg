<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="sq">
      <rect x="40" y="40" width="432" height="432" rx="32"/>
    </clipPath>
  </defs>

  <rect x="40" y="40" width="432" height="432" rx="32" fill="#1E1E20"/>

  <g clip-path="url(#sq)">
    <!-- Wide bottom block — muted olive -->
    <rect x="100" y="310" width="312" height="130" rx="20" fill="#7B8D5C" opacity="0.82" transform="rotate(-3 256 375)"/>

    <!-- Middle block — softer green -->
    <rect x="140" y="210" width="232" height="120" rx="16" fill="#9CAF78" opacity="0.78" transform="rotate(2 256 270)"/>

    <!-- Top block — lighter / yellow-green -->
    <rect x="180" y="120" width="152" height="110" rx="14" fill="#BCC99A" opacity="0.74" transform="rotate(-1 256 175)"/>

    <!-- Accent slice — teal -->
    <rect x="200" y="280" width="112" height="40" rx="10" fill="#6B9080" opacity="0.55" transform="rotate(1 256 300)"/>

    <!-- Stem — dark slim rect -->
    <rect x="251" y="70" width="10" height="60" rx="5" fill="#5A6B44"/>

    <!-- Small leaf — angled rect -->
    <rect x="268" y="72" width="42" height="14" rx="7" fill="#7FA358" opacity="0.75" transform="rotate(-35 289 79)"/>
  </g>

  <text x="256" y="490" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="300" letter-spacing="12" fill="#666">pearblossom</text>
</svg>
